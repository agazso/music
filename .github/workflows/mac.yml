name: mac
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write   # publish the release
jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: '**/pnpm-lock.yaml' }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm navidrome && pnpm build:frontend
        working-directory: desktop
      # unsigned build: assemble the app, ad-hoc sign it (required on Apple Silicon), then package dmg + zip
      - run: |
          pnpm pack:mac:dir
          codesign --force --deep --sign - "release/mac-arm64/Music.app"
          pnpm pack:mac
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: Music-mac-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
      # a tag push (v0.1.0 …) also publishes a GitHub release with the dmg and zip attached and notes from the commits
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" desktop/release/*.dmg desktop/release/*.zip --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
